[project]
name = "mbprobe"
version = "0.1.0"
description = "Modbus probe tool read-only untuk verifikasi controller di lapangan"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5", "typer>=0.27", "rich>=13", "PyYAML>=6", "prompt_toolkit>=3.0.52"]

[project.optional-dependencies]
sim = ["pymodbus>=3.6,<4"]
dev = ["pymodbus>=3.6,<4", "pytest>=8", "pyinstaller>=6"]

[project.scripts]
mbprobe = "mbprobe.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mbprobe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
